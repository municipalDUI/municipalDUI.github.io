<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives — frog and eagle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ece7dd;
    --ink-dim: #a39b8c;
    --bg: #14130f;
    --bg-soft: #1b1a15;
    --rule: #34322a;
    --accent: #b9683f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 0 28px; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    max-width: 820px; margin: 0 auto; padding: 26px 28px;
    flex-wrap: wrap; gap: 12px;
  }
  .nameplate {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 1.4rem; letter-spacing: -0.01em;
  }
  nav { display: flex; gap: 22px; font-family: 'Fraunces', serif;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; }
  nav a { color: var(--ink-dim); text-decoration: none; transition: color 0.2s; }
  nav a:hover, nav a:focus-visible { color: var(--accent); }

  /* ---- Header ---- */
  .arc-head { padding: 30px 0 10px; }
  .eyebrow {
    font-family: 'Fraunces', serif; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--accent); margin-bottom: 18px;
  }
  .arc-head h1 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.04;
    letter-spacing: -0.025em;
  }
  .arc-head p {
    margin-top: 18px; color: var(--ink-dim); max-width: 52ch;
    font-size: 1.12rem;
  }

  /* ---- Controls ---- */
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 34px 0 10px; border-bottom: 1px solid var(--rule);
    margin-bottom: 8px;
  }
  .search {
    flex: 1 1 280px; position: relative;
  }
  .search input {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    color: var(--ink);
    font-family: 'Newsreader', serif;
    font-size: 1.02rem;
    padding: 12px 16px 12px 42px;
    border-radius: 3px;
    transition: border-color 0.2s;
  }
  .search input::placeholder { color: var(--ink-dim); }
  .search input:focus {
    outline: none; border-color: var(--accent);
  }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--ink-dim); fill: none;
    stroke-width: 2;
  }

  .sort-group {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fraunces', serif; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-dim);
  }
  .seg {
    display: inline-flex; border: 1px solid var(--rule); border-radius: 3px;
    overflow: hidden;
  }
  .seg button {
    background: transparent; border: none; cursor: pointer;
    font-family: 'Fraunces', serif; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-dim); padding: 9px 14px;
    transition: background 0.2s, color 0.2s;
    border-left: 1px solid var(--rule);
  }
  .seg button:first-child { border-left: none; }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: var(--accent); color: var(--bg); }
  .seg button .dir { font-size: 0.7em; margin-left: 5px; opacity: 0.85; }

  /* ---- Results ---- */
  .results { padding: 8px 0 40px; }
  .count {
    font-family: 'Fraunces', serif; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-dim); padding: 18px 0 6px;
  }

  .entry {
    display: grid; grid-template-columns: 88px 1fr auto;
    gap: 24px; align-items: baseline;
    padding: 24px 0; border-top: 1px solid var(--rule);
    text-decoration: none; color: inherit;
    transition: padding-left 0.25s ease;
  }
  .entry:hover, .entry:focus-visible { padding-left: 10px; }
  .entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  .entry .date { font-family: 'Fraunces', serif; font-size: 0.85rem; color: var(--ink-dim); }
  .entry .title {
    font-family: 'Fraunces', serif; font-size: 1.3rem;
    line-height: 1.25; font-weight: 500; transition: color 0.2s;
  }
  .entry:hover .title, .entry:focus-visible .title { color: var(--accent); }
  .entry .meta { font-style: italic; color: var(--ink-dim); font-size: 0.98rem; margin-top: 6px; }
  .entry .meta .author { font-style: normal; }
  .entry .arrow {
    font-family: 'Fraunces', serif; color: var(--accent);
    opacity: 0; transform: translateX(-6px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .entry:hover .arrow, .entry:focus-visible .arrow { opacity: 1; transform: translateX(0); }

  .empty {
    padding: 50px 0; text-align: center; color: var(--ink-dim);
    font-style: italic; font-size: 1.15rem;
  }
  .empty.hidden { display: none; }

  footer {
    padding: 40px 0 60px; font-family: 'Fraunces', serif;
    font-size: 0.78rem; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.1em;
    border-top: 1px solid var(--rule);
  }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 600px) {
    body { font-size: 18px; }
    .wrap { padding: 0 20px; }
    .topbar { padding: 20px; }
    .controls { gap: 16px; }
    .sort-group { width: 100%; justify-content: space-between; }
    .seg { flex: 1; }
    .seg button { flex: 1; padding: 10px 8px; }
    .entry { grid-template-columns: 70px 1fr; gap: 16px; }
    .entry .arrow { display: none; }
    .entry .title { font-size: 1.18rem; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="nameplate">frog and eagle</div>
    <nav>
      <a href="index.html#essays">Essays</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>

  <div class="wrap">
    <header class="arc-head">
      <div class="eyebrow">Archives</div>
      <h1>Every piece, in one place.</h1>
      <p>Search the full collection, or sort by date, title, or author to find your way back to something.</p>
    </header>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input id="search" type="search" placeholder="Search titles, authors, places…" autocomplete="off" aria-label="Search archives">
      </div>
      <div class="sort-group">
        <span>Sort</span>
        <div class="seg" id="seg">
          <button data-key="date" class="active">Date <span class="dir">↓</span></button>
          <button data-key="title">A–Z <span class="dir"></span></button>
          <button data-key="author">Author <span class="dir"></span></button>
        </div>
      </div>
    </div>

    <div class="results">
      <div class="count" id="count"></div>
      <div id="list"></div>
      <div class="empty hidden" id="empty">Nothing here matches that. Try another word.</div>
    </div>

    <footer>
      © 2026 frog and eagle. &nbsp;·&nbsp; <a href="index.html">← Back home</a>
    </footer>
  </div>

<script>
  // ---- Single source of truth: essays.json ----
  // The archive lists EVERY essay. The front page shows only the newest few.
  // To add an essay: add one entry to essays.json. That's the only edit.
  let essays = [];

  const listEl   = document.getElementById('list');
  const countEl  = document.getElementById('count');
  const emptyEl  = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const seg      = document.getElementById('seg');

  // direction per key: date defaults newest-first (desc), text defaults A–Z (asc)
  let sortKey = 'date';
  const dir = { date: 'desc', title: 'asc', author: 'asc' };

  const fmtDate = iso => {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  };

  function sorted(items) {
    const d = dir[sortKey] === 'asc' ? 1 : -1;
    return [...items].sort((a, b) => {
      let av, bv;
      if (sortKey === 'date') { av = a.date; bv = b.date; }
      else { av = (a[sortKey] || '').toLowerCase(); bv = (b[sortKey] || '').toLowerCase(); }
      if (av < bv) return -1 * d;
      if (av > bv) return  1 * d;
      return 0;
    });
  }

  function filtered() {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) return essays;
    return essays.filter(e =>
      [e.title, e.author, e.place].some(f => (f || '').toLowerCase().includes(q))
    );
  }

  function render() {
    const items = sorted(filtered());
    listEl.innerHTML = items.map(e => `
      <a class="entry" href="${e.url}">
        <span class="date">${fmtDate(e.date)}</span>
        <span>
          <span class="title">${e.title}</span>
          <span class="meta"><span class="author">${e.author}</span> · ${e.place}</span>
        </span>
        <span class="arrow">Read →</span>
      </a>`).join('');

    const n = items.length;
    countEl.textContent = n + (n === 1 ? ' essay' : ' essays');
    emptyEl.classList.toggle('hidden', n !== 0);
  }

  // sort buttons: click toggles direction if same key, else switch key
  seg.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const key = btn.dataset.key;
    if (key === sortKey) {
      dir[key] = dir[key] === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
    }
    [...seg.children].forEach(b => {
      const on = b.dataset.key === sortKey;
      b.classList.toggle('active', on);
      b.querySelector('.dir').textContent = on ? (dir[b.dataset.key] === 'asc' ? '↑' : '↓') : '';
    });
    render();
  });

  searchEl.addEventListener('input', render);

  // Load the shared data, then render. Same file the front page uses.
  fetch('essays.json')
    .then(r => r.json())
    .then(data => { essays = data; render(); })
    .catch(() => {
      listEl.innerHTML = '';
      countEl.textContent = '';
      emptyEl.classList.remove('hidden');
      emptyEl.textContent = 'Could not load the archive. Open this page on your live site to see the essays.';
    });

</script>

</body>
</html>
